# IBMCloudVercel Configuration
# Copy this file to 'ibmcloudvercel.yml' and customize as needed
#
# Environment Variable Support:
#   Use ${VAR_NAME} syntax to reference environment variables
#   Use ${VAR_NAME:-default} to provide a default value
#   For Vercel: Set these in Project Settings > Environment Variables

# IBM Cloud Configuration (REQUIRED)
ibm_cloud:
  # IBM Cloud region where Code Engine project is located
  # Examples: us-south, us-east, eu-gb, eu-de, jp-tok, au-syd
  region: "${IBM_CLOUD_REGION:-us-south}"

  # Code Engine project ID or name (found in IBM Cloud Console)
  # Can be either:
  #   - Project ID (UUID format): xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  #   - Project name: my-project-name (will be resolved to ID automatically)
  project_id: "${IBM_CODE_ENGINE_PROJECT_ID}"

  # Registry secret for pushing built images to IBM Container Registry
  # Create with: ibmcloud ce secret create --name icr-secret --format registry \
  #              --server private.us.icr.io --username iamapikey --password <API_KEY>
  registry_secret: "${IBM_REGISTRY_SECRET:-icr-secret}"

  # Optional: ICR namespace for built images (default: code-engine)
  # registry_namespace: "my-namespace"

  # ===== BUILD CONFIGURATION =====

  # Build strategy: "buildpacks" (auto-detect) or "dockerfile"
  build_strategy: "buildpacks"

  # Build resource size: "small", "medium", "large", "xlarge"
  build_size: "medium"

  # Build timeout in seconds (default: 600 = 10 minutes)
  build_timeout: 600

  # Path to Dockerfile (only used when build_strategy is "dockerfile")
  # dockerfile_path: "Dockerfile"

  # ===== AUTHENTICATION (Choose ONE method) =====

  # RECOMMENDED: OIDC Authentication (Most Secure - No static secrets!)
  # Set this to use Vercel's OIDC token exchange via IBM Trusted Profile
  # This requires setting up an IBM Cloud Trusted Profile that trusts Vercel's OIDC issuer
  # Format: Profile-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  # trusted_profile_id: "${IBM_TRUSTED_PROFILE_ID}"

  # FALLBACK: API Key Authentication
  # If trusted_profile_id is not set, falls back to using IBM_CLOUD_API_KEY env var
  # Set IBM_CLOUD_API_KEY in Vercel Environment Variables
  # Note: OIDC is preferred as it uses short-lived tokens instead of static secrets

  # ===== OPTIONAL: COS CONFIGURATION =====
  # Only needed if you want to use COS for artifact storage
  # cos_bucket: "${IBM_COS_BUCKET_NAME}"
  # cos_endpoint: "${IBM_COS_ENDPOINT}"

# Application Scaling Configuration (OPTIONAL)
# These are sensible defaults - adjust based on your application needs
scaling:
  # Minimum number of instances (0 = scale to zero when idle)
  min_scale: 0

  # Maximum number of instances
  max_scale: 10

  # CPU allocation per instance (0.25, 0.5, 1.0, 2.0, 4.0, 8.0)
  cpu: "0.25"

  # Memory allocation per instance (0.5G, 1G, 2G, 4G, 8G, 16G, 32G)
  memory: "0.5G"

  # Application port (must match your app's listening port)
  port: 8080

  # Maximum concurrent requests per instance
  concurrency: 100

# Deployment Options (OPTIONAL)
# Directory containing source code to deploy (relative to repo root)
source_dir: "."
